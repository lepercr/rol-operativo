<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Rol Operativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:white;padding:18px}.wrap{max-width:1050px;margin:auto;padding:14px}h1{margin:0;font-size:23px}.sub{opacity:.75;font-size:13px}nav{display:flex;gap:6px;overflow:auto;background:white;padding:8px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:white;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}.page{display:none}.page.active{display:block}.card{background:white;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:block;font-size:12px;font-weight:800;color:#4b5563;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}textarea{min-height:95px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0}.small{font-size:12px;color:#6b7280}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px}.reportHead{background:#111827;color:white;padding:16px}.reportItem{background:white;border:1px solid #ddd;border-top:0;padding:15px}.reportGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.login{max-width:430px;margin:7vh auto}.hidden{display:none!important}@media print{header,nav,.no-print{display:none!important}body{background:white}}
</style></head><body>
<header><div class="wrap"><h1>🚓 Rol Operativo</h1><div class="sub">Planificación del servicio</div></div></header>
<section id="login" class="login card"><h2>🔐 Acceso</h2><p class="small">Ingresá con tu cuenta autorizada.</p><label>Correo</label><input id="email" type="email"><label style="margin-top:10px">Contraseña</label><input id="password" type="password"><div class="actions"><button onclick="signIn()">Iniciar sesión</button><button class="secondary" onclick="signUp()">Crear cuenta</button></div><p id="authMsg" class="small"></p></section>
<div id="app" class="hidden"><nav><button data-p="inicio">Inicio</button><button data-p="personal">👮 Personal</button><button data-p="patrullas">🚓 Patrullas</button><button data-p="rol">📋 Nuevo rol</button><button data-p="historial">📚 Historial</button><button onclick="signOut()" class="secondary">Salir</button></nav><main class="wrap">
<section id="inicio" class="page active"><div class="card"><h2>Panel</h2><div class="grid"><div><b id="kPeople">0</b><div class="small">Funcionarios</div></div><div><b id="kCars">0</b><div class="small">Patrullas</div></div><div><b id="kRoles">0</b><div class="small">Roles</div></div></div></div><div class="card"><div class="actions"><button onclick="go('rol')">📋 Crear rol</button><button class="secondary" onclick="go('personal')">➕ Personal</button><button class="secondary" onclick="go('patrullas')">🚓 Patrulla</button></div></div></section>
<section id="personal" class="page"><div class="card"><h2>👮 Personal</h2><div class="grid"><div><label>Nombre completo</label><input id="personName"></div><div><label>Función / puesto</label><input id="personRole"></div><div><label>Estado</label><select id="personState"><option>Disponible</option><option>No disponible</option></select></div></div><div class="actions"><button onclick="addPerson()">➕ Agregar funcionario</button></div></div><div class="card" id="peopleList"></div></section>
<section id="patrullas" class="page"><div class="card"><h2>🚓 Patrullas</h2><div class="grid"><div><label>Número</label><input id="carNumber"></div><div><label>Tipo</label><input id="carType" placeholder="Patrulla"></div><div><label>Estado</label><select id="carState"><option>Disponible</option><option>No disponible</option></select></div></div><div class="actions"><button onclick="addCar()">➕ Agregar patrulla</button></div></div><div class="card" id="carsList"></div></section>
<section id="rol" class="page"><div class="card"><h2>📋 Nuevo rol</h2><div class="grid"><div><label>Fecha</label><input id="roleDate" type="date"></div><div><label>Horario / turno</label><input id="roleShift" placeholder="06:00 - 18:00"></div><div><label>Encargado</label><input id="roleLeader"></div></div></div><div id="units"></div><div class="card no-print"><div class="actions"><button onclick="addUnit()">➕ Agregar patrulla</button><button class="secondary" onclick="copyLast()">📋 Copiar último rol</button><button class="secondary" onclick="saveRole()">💾 Guardar rol</button></div></div></section>
<section id="historial" class="page"><div class="card"><h2>📚 Historial</h2><div id="historyList"></div></div></section>
<section id="informe" class="page"><div id="report"></div><div class="card no-print"><button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://twnpkicoenwonvvxcqjm.supabase.co","sb_publishable_JI19iTrqw0ywlmx7vhCM9w_QYCmrDmA");
let people=[],cars=[],roles=[],draft=[]; roleDate.value=new Date().toISOString().slice(0,10);
document.querySelectorAll("nav button[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const msg=t=>authMsg.textContent=t;
async function signIn(){msg("Ingresando...");let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});msg(r.error?r.error.message:"Sesión iniciada.");if(!r.error)await showApp()}
async function signUp(){msg("Creando cuenta...");let r=await sb.auth.signUp({email:email.value.trim(),password:password.value});msg(r.error?r.error.message:"Cuenta creada. Si pide confirmación, confirmá el correo y luego iniciá sesión.")}
async function signOut(){await sb.auth.signOut();showLogin()}
function showLogin(){login.classList.remove("hidden");app.classList.add("hidden")}
async function showApp(){login.classList.add("hidden");app.classList.remove("hidden");await loadAll();go("inicio")}
function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");if(p==="rol")renderUnits();if(p==="historial")renderHistory()}
async function loadAll(){let [p,c,r]=await Promise.all([sb.from("personal").select("*").order("nombre"),sb.from("patrullas").select("*").order("numero"),sb.from("roles").select("*").order("created_at")]);if(p.error||c.error||r.error)return alert((p.error||c.error||r.error).message);people=p.data||[];cars=c.data||[];roles=r.data||[];refresh()}
async function addPerson(){let n=personName.value.trim();if(!n)return alert("Ingresá el nombre.");let r=await sb.from("personal").insert({nombre:n,funcion:personRole.value.trim(),estado:personState.value});if(r.error)alert(r.error.message);else{personName.value="";personRole.value="";await loadAll()}}
async function delPerson(id){if(confirm("¿Eliminar funcionario?")){let r=await sb.from("personal").delete().eq("id",id);if(r.error)alert(r.error.message);else await loadAll()}}
function renderPeople(){peopleList.innerHTML=people.length?people.map(p=>`<div class=item><b>${esc(p.nombre)}</b><div class=small>${esc(p.funcion||"Sin función")} · ${esc(p.estado)}</div><div class=actions><button class=danger onclick="delPerson('${p.id}')">Eliminar</button></div></div>`).join(""):"<div class=small>No hay funcionarios.</div>"}
async function addCar(){let n=carNumber.value.trim();if(!n)return alert("Ingresá el número.");let r=await sb.from("patrullas").insert({numero:n,tipo:carType.value.trim(),estado:carState.value});if(r.error)alert(r.error.message);else{carNumber.value="";carType.value="";await loadAll()}}
async function delCar(id){if(confirm("¿Eliminar patrulla?")){let r=await sb.from("patrullas").delete().eq("id",id);if(r.error)alert(r.error.message);else await loadAll()}}
function renderCars(){carsList.innerHTML=cars.length?cars.map(c=>`<div class=item><b>🚓 ${esc(c.numero)}</b><div class=small>${esc(c.tipo||"Patrulla")} · ${esc(c.estado)}</div><div class=actions><button class=danger onclick="delCar('${c.id}')">Eliminar</button></div></div>`).join(""):"<div class=small>No hay patrullas.</div>"}
function pOpts(s){return '<option value="">— Seleccionar —</option>'+people.filter(p=>p.estado==="Disponible").map(p=>`<option value="${p.id}" ${p.id===s?"selected":""}>${esc(p.nombre)}</option>`).join("")}
function cOpts(s){return '<option value="">— Seleccionar —</option>'+cars.filter(c=>c.estado==="Disponible").map(c=>`<option value="${c.id}" ${c.id===s?"selected":""}>${esc(c.numero)}</option>`).join("")}
function addUnit(){draft.push({unitType:"patrulla",car:"",driver:"",comp:"",support:"",breakfast:"",lunch:"",coffee:"",sector:"",tasks:""});renderUnits()}
function setU(i,k,v){draft[i][k]=v}
function delU(i){draft.splice(i,1);renderUnits()}
function renderUnits(){units.innerHTML=draft.length?draft.map((u,i)=>{let pairNo=draft.slice(0,i).filter(x=>x.unitType==="pareja").length+1;let titulo=u.unitType==="moto"?(find(cars,u.car,"numero")!=="-"?"🏍️ Moto "+find(cars,u.car,"numero"):"🏍️ Moto") :u.unitType==="pareja"?"👮 Pareja "+pairNo:(find(cars,u.car,"numero")!=="-"?"🚓 Patrulla "+find(cars,u.car,"numero"):"🚓 Patrulla");return `<div class=card><h3>${titulo}</h3><div class=grid><div><label>Tipo de unidad</label><select onchange="setU(${i},'unitType',this.value)"><option value="patrulla" ${u.unitType==="patrulla"||!u.unitType?"selected":""}>🚓 Patrulla</option><option value="moto" ${u.unitType==="moto"?"selected":""}>🏍️ Moto</option><option value="pareja" ${u.unitType==="pareja"?"selected":""}>👮 Pareja en recorrido</option></select></div></div>${u.unitType==="pareja"?`<div class=grid><div><label>👮 Oficial 1</label><select onchange="setU(${i},'driver',this.value)">${pOpts(u.driver)}</select></div><div><label>👮 Oficial 2</label><select onchange="setU(${i},'comp',this.value)">${pOpts(u.comp)}</select></div></div>`:u.unitType==="moto"?`<div class=grid><div><label>🏍️ Moto</label><select onchange="setU(${i},'car',this.value)">${cOpts(u.car)}</select></div><div><label>👮 Oficial</label><select onchange="setU(${i},'driver',this.value)">${pOpts(u.driver)}</select></div><div><label>👮 Acompañante</label><select onchange="setU(${i},'comp',this.value)">${pOpts(u.comp)}</select></div></div>`:`<div class=grid><div><label>🚓 Patrulla</label><select onchange="setU(${i},'car',this.value)">${cOpts(u.car)}</select></div><div><label>👮 Chofer</label><select onchange="setU(${i},'driver',this.value)">${pOpts(u.driver)}</select></div><div><label>👮 Acompañante</label><select onchange="setU(${i},'comp',this.value)">${pOpts(u.comp)}</select></div><div><label>👮 Apoyo</label><select onchange="setU(${i},'support',this.value)">${pOpts(u.support)}</select></div></div>`}<h4>🍽️ Horario de alimentación</h4><div class=grid><div><label>🍳 Desayuno</label><input type=time value="${esc(u.breakfast)}" onchange="setU(${i},'breakfast',this.value)"></div><div><label>🍛 Almuerzo</label><input type=time value="${esc(u.lunch)}" onchange="setU(${i},'lunch',this.value)"></div><div><label>☕ Café</label><input type=time value="${esc(u.coffee)}" onchange="setU(${i},'coffee',this.value)"></div><div><label>📍 Sector asignado</label><input value="${esc(u.sector)}" onchange="setU(${i},'sector',this.value)"></div></div><div style="margin-top:10px"><label>🎯 Labores a realizar</label><textarea onchange="setU(${i},'tasks',this.value)">${esc(u.tasks)}</textarea></div><div class=actions><button class=danger onclick="delU(${i})">Eliminar unidad</button></div></div>`}).join(""):"Agregá una unidad para comenzar."}
async function getUnits(id){let r=await sb.from("asignaciones").select("*").eq("rol_id",id).order("created_at");if(r.error){alert(r.error.message);return []}return r.data||[]}
async function copyLast(){let r=roles.at(-1);if(!r)return alert("No hay rol anterior.");let u=await getUnits(r.id);draft=u.map(x=>({car:x.patrulla_id,driver:x.chofer_id,comp:x.acompanante_id||"",support:x.apoyo_id||"",breakfast:x.desayuno||"",lunch:x.almuerzo||"",coffee:x.cafe||"",sector:x.sector||"",tasks:x.labores||""}));roleShift.value=r.turno||"";roleLeader.value=r.encargado||"";renderUnits()}
async function saveRole(){
  if(!draft.length)return alert("Agregá una unidad.");

  for(let u of draft){
    let type=u.unitType||"patrulla";

   if(type==="patrulla"&&!u.car)
      return alert("La patrulla necesita un vehículo.");

    if(type==="patrulla"&&!u.driver)
      return alert("La patrulla necesita un chofer.");

    if(type==="moto"&&!u.car)
      return alert("La moto necesita seleccionar una moto.");

    if(type==="moto"&&!u.driver)
      return alert("La moto necesita un oficial.");

    if(type==="pareja"&&(!u.driver||!u.comp))
      return alert("La pareja en recorrido necesita dos oficiales.");
  }

  let used=[];

  for(let u of draft){
    for(let id of [u.driver,u.comp,u.support]){
      if(id){
        if(used.includes(id))
          return alert("Un funcionario está asignado a más de una unidad.");

        used.push(id);
      }
    }
  }

  let rr=await sb.from("roles").insert({
    fecha:roleDate.value,
    turno:roleShift.value,
    encargado:roleLeader.value
  }).select().single();

  if(rr.error)return alert(rr.error.message);

  let rows=draft.map(u=>({
    rol_id:rr.data.id,
    tipo_unidad:u.unitType||"patrulla",
    patrulla_id:u.car||null,
    chofer_id:u.driver||null,
    acompanante_id:u.comp||null,
    apoyo_id:u.support||null,
    desayuno:u.breakfast||null,
    almuerzo:u.lunch||null,
    cafe:u.coffee||null,
    sector:u.sector||null,
    labores:u.tasks||null
  }));

  let ir=await sb.from("asignaciones").insert(rows);

  if(ir.error){
    await sb.from("roles").delete().eq("id",rr.data.id);
    return alert(ir.error.message);
  }

  draft=[];
  await loadAll();
  await showReport(rr.data);
  go("informe");
}
function find(a,id,k){let x=a.find(y=>y.id===id);return x?x[k]:"—"}
async function showReport(r){let us=await getUnits(r.id);report.innerHTML=`<div class=reportHead><b>ROL DE SERVICIO OPERATIVO</b><div>${esc(r.fecha)} ${r.turno?"• "+esc(r.turno):""} ${r.encargado?"• Encargado: "+esc(r.encargado):""}</div></div>`+us.map((u,i)=>`<div class=reportItem><h3>🚓 ${esc(find(cars,u.patrulla_id,"numero")||"Unidad "+(i+1))}</h3><div class=reportGrid><div><span class=small>Chofer</span><br><b>${esc(find(people,u.chofer_id,"nombre"))}</b></div><div><span class=small>Acompañante</span><br><b>${esc(find(people,u.acompanante_id,"nombre"))}</b></div><div><span class=small>Apoyo</span><br><b>${esc(find(people,u.apoyo_id,"nombre"))}</b></div><div><span class=small>🍽️ Alimentación</span><br>🍳 ${esc(u.desayuno||"—")} · 🍛 ${esc(u.almuerzo||"—")} · ☕ ${esc(u.cafe||"—")}</div><div><span class=small>📍 Sector</span><br><b>${esc(u.sector||"—")}</b></div></div><p><span class=small>🎯 Labores</span><br>${esc(u.labores||"—").replace(/\n/g,"<br>")}</p></div>`).join("")+`<div class=card><b>Total de patrullas:</b> ${us.length}</div>`}
function renderHistory(){historyList.innerHTML=roles.length?roles.slice().reverse().map(r=>`<div class=item><b>${esc(r.fecha)}</b> · ${esc(r.turno||"")}<div class=small>${esc(r.encargado||"")}</div><div class=actions><button onclick="openRole('${r.id}')">Ver informe</button><button class=secondary onclick="duplicateRole('${r.id}')">Duplicar</button></div></div>`).join(""):"<div class=small>No hay roles.</div>"}
async function openRole(id){let r=roles.find(x=>x.id===id);if(r){await showReport(r);go("informe")}}
async function duplicateRole(id){let r=roles.find(x=>x.id===id);if(!r)return;let us=await getUnits(id);draft=us.map(x=>({car:x.patrulla_id,driver:x.chofer_id,comp:x.acompanante_id||"",support:x.apoyo_id||"",breakfast:x.desayuno||"",lunch:x.almuerzo||"",coffee:x.cafe||"",sector:x.sector||"",tasks:x.labores||""}));roleDate.value=new Date().toISOString().slice(0,10);roleShift.value=r.turno||"";roleLeader.value=r.encargado||"";go("rol")}
function refresh(){kPeople.textContent=people.length;kCars.textContent=cars.length;kRoles.textContent=roles.length;renderPeople();renderCars()}
(async()=>{let s=await sb.auth.getSession();s.data.session?showApp():showLogin()})();
</script></body></html>
