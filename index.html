<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Rol Operativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px}.wrap{max-width:1050px;margin:auto;padding:14px}h1{margin:0;font-size:23px}.sub{opacity:.75;font-size:13px}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:0;z-index:10;border-bottom:1px solid #ddd}nav button{white-space:nowrap}
button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}
.page{display:none}.page.active{display:block}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #00000012}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:block;font-size:12px;font-weight:800;color:#4b5563;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff;font:inherit}textarea{min-height:95px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0;background:#fafafa}
.small{font-size:12px;color:#6b7280}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;font-size:13px}
.reportHead{background:#111827;color:#fff;padding:16px;border-radius:12px 12px 0 0}.reportItem{background:#fff;border:1px solid #e5e7eb;border-top:0;padding:15px}.reportGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style></head><body>
<header><div class="wrap"><h1>🚓 Rol Operativo</h1><div class="sub">Planificación del servicio</div></div></header>
<nav><button data-p="inicio">Inicio</button><button data-p="personal">👮 Personal</button><button data-p="patrullas">🚓 Patrullas</button><button data-p="rol">📋 Nuevo rol</button><button data-p="historial">📚 Historial</button></nav>
<main class="wrap">
<section id="inicio" class="page active"><div class="card"><h2>Panel</h2><div class="grid">
<div><b id="kPeople">0</b><div class="small">Funcionarios</div></div><div><b id="kCars">0</b><div class="small">Patrullas</div></div><div><b id="kRoles">0</b><div class="small">Roles</div></div></div></div>
<div class="card"><h2>Acciones rápidas</h2><div class="actions"><button onclick="go('rol')">📋 Crear rol</button><button class="secondary" onclick="go('personal')">➕ Personal</button><button class="secondary" onclick="go('patrullas')">🚓 Patrulla</button></div></div>
<div class="notice">Los datos se guardan localmente en este navegador. Probá primero con datos ficticios.</div></section>

<section id="personal" class="page"><div class="card"><h2>👮 Personal</h2><div class="grid">
<div><label>Nombre completo</label><input id="personName"></div><div><label>Función / puesto</label><input id="personRole" placeholder="Oficial"></div><div><label>Estado</label><select id="personState"><option>Disponible</option><option>No disponible</option></select></div></div>
<div class="actions"><button onclick="addPerson()">➕ Agregar funcionario</button></div></div><div class="card"><div id="peopleList"></div></div></section>

<section id="patrullas" class="page"><div class="card"><h2>🚓 Patrullas</h2><div class="grid">
<div><label>Número</label><input id="carNumber" placeholder="01-1234"></div><div><label>Tipo</label><input id="carType" placeholder="Patrulla"></div><div><label>Estado</label><select id="carState"><option>Disponible</option><option>No disponible</option></select></div></div>
<div class="actions"><button onclick="addCar()">➕ Agregar patrulla</button></div></div><div class="card"><div id="carsList"></div></div></section>

<section id="rol" class="page"><div class="card"><h2>📋 Nuevo rol</h2><div class="grid">
<div><label>Fecha</label><input id="roleDate" type="date"></div><div><label>Horario / turno</label><input id="roleShift" placeholder="06:00 - 18:00"></div><div><label>Encargado</label><input id="roleLeader"></div></div></div>
<div id="units"></div><div class="card no-print"><div class="actions"><button onclick="addUnit()">➕ Agregar patrulla</button><button class="secondary" onclick="copyLast()">📋 Copiar último rol</button><button class="secondary" onclick="saveRole()">💾 Guardar rol</button></div></div></section>

<section id="historial" class="page"><div class="card"><h2>📚 Historial</h2><div id="historyList"></div></div></section>
<section id="informe" class="page"><div id="report"></div><div class="card no-print"><button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button></div></section>
</main>
<script>
const KEY="rolOperativoV1";let db=JSON.parse(localStorage.getItem(KEY)||'{"people":[],"cars":[],"roles":[],"draft":[]}');
roleDate.value=new Date().toISOString().slice(0,10);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));refresh();
function persist(){localStorage.setItem(KEY,JSON.stringify(db));refresh()}
function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");if(p==="rol")renderUnits();if(p==="historial")renderHistory()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function addPerson(){let n=personName.value.trim();if(!n)return alert("Ingresá el nombre.");db.people.push({id:crypto.randomUUID(),name:n,role:personRole.value,state:personState.value});personName.value="";personRole.value="";persist()}
function delPerson(id){db.people=db.people.filter(x=>x.id!==id);persist()}
function renderPeople(){peopleList.innerHTML=db.people.length?db.people.map(p=>`<div class=item><b>${esc(p.name)}</b><div class=small>${esc(p.role||"Sin función")} · ${esc(p.state)}</div><div class=actions><button class=danger onclick="delPerson('${p.id}')">Eliminar</button></div></div>`).join(""):"<div class=small>No hay funcionarios.</div>"}
function addCar(){let n=carNumber.value.trim();if(!n)return alert("Ingresá el número.");db.cars.push({id:crypto.randomUUID(),num:n,type:carType.value,state:carState.value});carNumber.value="";carType.value="";persist()}
function delCar(id){db.cars=db.cars.filter(x=>x.id!==id);persist()}
function renderCars(){carsList.innerHTML=db.cars.length?db.cars.map(c=>`<div class=item><b>🚓 ${esc(c.num)}</b><div class=small>${esc(c.type||"Patrulla")} · ${esc(c.state)}</div><div class=actions><button class=danger onclick="delCar('${c.id}')">Eliminar</button></div></div>`).join(""):"<div class=small>No hay patrullas.</div>"}
function pOpts(s){return '<option value="">— Seleccionar —</option>'+db.people.filter(p=>p.state==="Disponible").map(p=>`<option value="${p.id}" ${p.id===s?"selected":""}>${esc(p.name)}</option>`).join("")}
function cOpts(s){return '<option value="">— Seleccionar —</option>'+db.cars.filter(c=>c.state==="Disponible").map(c=>`<option value="${c.id}" ${c.id===s?"selected":""}>${esc(c.num)}</option>`).join("")}
function addUnit(){db.draft.push({car:"",driver:"",comp:"",support:"",breakfast:"",lunch:"",coffee:"",sector:"",tasks:""});renderUnits()}
function setU(i,k,v){db.draft[i][k]=v;localStorage.setItem(KEY,JSON.stringify(db))}
function delU(i){db.draft.splice(i,1);renderUnits()}
function renderUnits(){units.innerHTML=db.draft.length?db.draft.map((u,i)=>`<div class=card><h3>🚓 Unidad ${i+1}</h3><div class=grid>
<div><label>Patrulla</label><select onchange="setU(${i},'car',this.value)">${cOpts(u.car)}</select></div>
<div><label>Chofer</label><select onchange="setU(${i},'driver',this.value)">${pOpts(u.driver)}</select></div>
<div><label>Acompañante</label><select onchange="setU(${i},'comp',this.value)">${pOpts(u.comp)}</select></div>
<div><label>Apoyo</label><select onchange="setU(${i},'support',this.value)">${pOpts(u.support)}</select></div></div>
<h4>🍽️ Horario de alimentación</h4><div class=grid>
<div><label>🍳 Desayuno</label><input type=time value="${esc(u.breakfast)}" onchange="setU(${i},'breakfast',this.value)"></div>
<div><label>🍛 Almuerzo</label><input type=time value="${esc(u.lunch)}" onchange="setU(${i},'lunch',this.value)"></div>
<div><label>☕ Café</label><input type=time value="${esc(u.coffee)}" onchange="setU(${i},'coffee',this.value)"></div>
<div><label>📍 Sector asignado</label><input value="${esc(u.sector)}" onchange="setU(${i},'sector',this.value)"></div></div>
<div style="margin-top:10px"><label>🎯 Labores a realizar</label><textarea onchange="setU(${i},'tasks',this.value)">${esc(u.tasks)}</textarea></div>
<div class=actions><button class=danger onclick="delU(${i})">Eliminar unidad</button></div></div>`).join(""):"<div class=notice>Agregá una patrulla para comenzar.</div>"}
function copyLast(){let r=db.roles.at(-1);if(!r)return alert("No hay rol anterior.");db.draft=JSON.parse(JSON.stringify(r.units));roleShift.value=r.shift||"";roleLeader.value=r.leader||"";renderUnits()}
function saveRole(){if(!db.draft.length)return alert("Agregá una patrulla.");for(const u of db.draft)if(!u.car||!u.driver)return alert("Cada unidad necesita patrulla y chofer.");let used=[];for(const u of db.draft)for(const id of [u.driver,u.comp,u.support])if(id){if(used.includes(id))return alert("Un funcionario está asignado a más de una unidad.");used.push(id)}let r={id:crypto.randomUUID(),date:roleDate.value,shift:roleShift.value,leader:roleLeader.value,units:JSON.parse(JSON.stringify(db.draft))};db.roles.push(r);db.draft=[];persist();showReport(r);go("informe")}
function find(a,id,k){let x=a.find(y=>y.id===id);return x?x[k]:"—"}
function showReport(r){report.innerHTML=`<div class=reportHead><b>ROL DE SERVICIO OPERATIVO</b><div>${esc(r.date)} ${r.shift?"• "+esc(r.shift):""} ${r.leader?"• Encargado: "+esc(r.leader):""}</div></div>`+r.units.map((u,i)=>`<div class=reportItem><h3>🚓 ${esc(find(db.cars,u.car,"num")||"Unidad "+(i+1))}</h3><div class=reportGrid>
<div><span class=small>Chofer</span><br><b>${esc(find(db.people,u.driver,"name"))}</b></div><div><span class=small>Acompañante</span><br><b>${esc(find(db.people,u.comp,"name"))}</b></div><div><span class=small>Apoyo</span><br><b>${esc(find(db.people,u.support,"name"))}</b></div>
<div><span class=small>🍽️ Alimentación</span><br>🍳 ${esc(u.breakfast||"—")} · 🍛 ${esc(u.lunch||"—")} · ☕ ${esc(u.coffee||"—")}</div><div><span class=small>📍 Sector</span><br><b>${esc(u.sector||"—")}</b></div></div><p><span class=small>🎯 Labores</span><br>${esc(u.tasks||"—").replace(/\n/g,"<br>")}</p></div>`).join("")+`<div class=card><b>Total de patrullas:</b> ${r.units.length}</div>`}
function renderHistory(){historyList.innerHTML=db.roles.length?db.roles.slice().reverse().map(r=>`<div class=item><b>${esc(r.date)}</b> · ${esc(r.shift||"")}<div class=small>${r.units.length} patrulla(s) · ${esc(r.leader||"")}</div><div class=actions><button onclick="showReport(db.roles.find(x=>x.id==='${r.id}'));go('informe')">Ver informe</button></div></div>`).join(""):"<div class=small>No hay roles.</div>"}
function refresh(){kPeople.textContent=db.people.length;kCars.textContent=db.cars.length;kRoles.textContent=db.roles.length;renderPeople();renderCars()}
</script></body></html>
